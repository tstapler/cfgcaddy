name: CI
on: pull_request

jobs:
  lint-and-format:
    name: Check formatting and lint
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --extra dev
      - name: Check formatting (ruff format)
        run: uv run ruff format --check .
      - name: Lint (ruff check)
        run: uv run ruff check .
  ci:
    strategy:
      fail-fast: false
      matrix:
        # 3.7 dropped: uv/python-build-standalone no longer ships 3.7
        # interpreters, and pyproject.toml's requires-python floor is
        # informational only at this point since the runtime is EOL.
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: lint-and-format
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest -v
      - name: Run Build
        run: uv build
